openapi: 3.1.0
info:
  title: Practice Catalog API
  description: |
    Бэкенд мобильного каталога товаров (Добрушский фарфоровый завод).

    Соглашения:
    - Деньги — целые копейки (BYN), `integer`/`int64`.
    - Даты и время — ISO-8601, UTC (`2026-08-17T12:00:00Z`).
    - Ошибки — единый формат RFC 9457 Problem Details (схема `ProblemDetails`).
    - Пагинация — `page` (0-based) + `size` (по умолчанию 20, максимум 100); конверт `{items, page, size, total, totalPages}`.
    - Идемпотентность запросов, меняющих состояние, — заголовок `X-Request-Id`.

    Подробнее: [03-api-design.md](03-api-design.md), [02-domain-model.md](02-domain-model.md).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Локальная разработка
tags:
  - name: Auth
    description: Регистрация, вход, токены, профиль
  - name: Catalog
    description: "Публичный каталог: категории, товары, карточки, отзывы"
  - name: Cart
    description: Корзина пользователя
  - name: Orders
    description: Заказы пользователя
  - name: Favorites
    description: Избранное пользователя
  - name: Reviews
    description: Отзывы пользователя
  - name: Admin
    description: Администрирование каталога, заказов, отзывов
security:
  - BearerAuth: []
paths:
  /api/v1/categories:
    get:
      tags: [Catalog]
      summary: Дерево категорий
      description: Возвращает активные категории с вложенными подкатегориями.
      security: []
      responses:
        "200":
          description: Дерево категорий
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryNode"
              examples:
                tree:
                  value:
                    - id: a1b2c3d4-1111-4c1e-9f2c-000000000001
                      name: Сервизы
                      slug: servizy
                      imageUrl: http://localhost:8080/catalog-images/categories/1a2b.jpg
                      sortOrder: 1
                      children:
                        - id: a1b2c3d4-1111-4c1e-9f2c-000000000002
                          name: Чайные сервизы
                          slug: chainye-servizy
                          imageUrl: null
                          sortOrder: 1
                          children: []
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/products:
    get:
      tags: [Catalog]
      summary: Поиск и список товаров
      description: |
        Поиск с фильтрами, сортировкой и пагинацией. Фильтры `inStock` и `onlyDiscounted`
        выполняются напрямую к БД (без кэша) и требуют актуальных остатков.
      security: []
      parameters:
        - name: q
          in: query
          description: Поиск по названию, артикулу, серии
          schema: { type: string, maxLength: 200 }
        - name: categoryId
          in: query
          description: Идентификатор категории (включает подкатегории)
          schema: { type: string, format: uuid }
        - name: priceFrom
          in: query
          description: Минимальная цена со скидкой, копейки
          schema: { type: integer, format: int64, minimum: 0 }
        - name: priceTo
          in: query
          description: Максимальная цена со скидкой, копейки
          schema: { type: integer, format: int64, minimum: 0 }
        - name: series
          in: query
          description: Серия/коллекция
          schema: { type: string, maxLength: 200 }
        - name: type
          in: query
          description: Тип изделия (сервиз, чашка, ваза, статуэтка...)
          schema: { type: string, maxLength: 100 }
        - name: inStock
          in: query
          description: Только товары с остатком больше 0
          schema: { type: boolean }
        - name: onlyDiscounted
          in: query
          description: Только товары со скидкой
          schema: { type: boolean }
        - name: sort
          in: query
          description: Сортировка
          schema:
            type: string
            enum: [price_asc, price_desc, rating_desc, newest, discount_desc]
            default: newest
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Страница товаров
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsPage"
              examples:
                page:
                  $ref: "#/components/examples/ProductsPageExample"
        "400":
          $ref: "#/components/responses/ValidationError"
  /api/v1/products/{id}:
    get:
      tags: [Catalog]
      summary: Карточка товара
      description: "Полные данные товара: характеристики, изображения, SKU с остатками, рейтинг."
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Карточка товара
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
              examples:
                card:
                  $ref: "#/components/examples/ProductResponseExample"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/products/{id}/reviews:
    get:
      tags: [Catalog]
      summary: Отзывы товара
      description: Список опубликованных (одобренных модерацией) отзывов, сортировка по новизне.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Страница отзывов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewsPage"
              examples:
                page:
                  value:
                    items:
                      - id: r1
                        userFirstName: Анна
                        rating: 5
                        text: Красивая роспись, доставка быстрая.
                        createdAt: "2026-08-15T10:00:00Z"
                    page: 0
                    size: 20
                    total: 1
                    totalPages: 1
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Reviews]
      summary: Оставить отзыв
      description: |
        Только покупатель товара (наличие заказа со статусом DELIVERED).
        Один отзыв на товар. Опубликован после модерации.
      operationId: createReview
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
            examples:
              create:
                value: { rating: 5, text: "Красивая роспись, доставка быстрая." }
      responses:
        "201":
          description: Отзыв создан (ожидает модерации)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
              examples:
                created:
                  value:
                    id: r1
                    userFirstName: Анна
                    rating: 5
                    text: "Красивая роспись, доставка быстрая."
                    isModerated: false
                    createdAt: "2026-08-17T12:15:00Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация
      description: Создаёт пользователя с ролью USER и сразу выдаёт пару токенов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              register:
                value:
                  email: ivan@example.com
                  password: "StrongPass123"
                  firstName: Иван
                  lastName: Иванов
                  phone: "+375291234567"
      responses:
        "201":
          description: Пользователь создан, пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              examples:
                tokens:
                  $ref: "#/components/examples/TokenResponseExample"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              login:
                value: { email: ivan@example.com, password: "StrongPass123" }
      responses:
        "200":
          description: Пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              examples:
                tokens:
                  $ref: "#/components/examples/TokenResponseExample"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Ротация refresh-токена
      description: |
        Принимает refresh-токен (в теле), отзывает старый и выдаёт новую пару.
        Повторное использование отозванного токена отзывает все refresh-токены пользователя.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            examples:
              refresh:
                value: { refreshToken: "eyJhbGciOiJIUzI1NiIs..." }
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Выход
      description: Отзывает текущий refresh-токен пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Токен отозван
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Выход со всех устройств
      description: Отзывает все refresh-токены пользователя.
      responses:
        "204":
          description: Все токены отозваны
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Смена пароля
      description: |
        Требует текущий пароль и новый пароль (введённый дважды).
        При успехе все refresh-токены пользователя отзываются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            examples:
              change:
                value:
                  currentPassword: "OldPass123"
                  newPassword: "NewPass456"
                  newPasswordConfirm: "NewPass456"
      responses:
        "204":
          description: Пароль изменён
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Профиль текущего пользователя
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
              examples:
                profile:
                  value:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    email: ivan@example.com
                    firstName: Иван
                    lastName: Иванов
                    phone: "+375291234567"
                    role: USER
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/cart:
    get:
      tags: [Cart]
      summary: Содержимое корзины
      description: |
        Цены пересчитываются из актуальных данных каталога.
        Недоступные позиции (неактивный товар/SKU, превышение остатка) помечаются unavailable.
      responses:
        "200":
          description: Корзина
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
              examples:
                cart:
                  $ref: "#/components/examples/CartResponseExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/cart/items:
    post:
      tags: [Cart]
      summary: Добавить позицию
      description: Повторное добавление того же SKU увеличивает количество.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
            examples:
              add:
                value: { skuId: s1, quantity: 2 }
      responses:
        "201":
          description: Позиция добавлена (обновлённая корзина)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /api/v1/cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Изменить количество
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
            examples:
              update:
                value: { quantity: 3 }
      responses:
        "200":
          description: Обновлённая корзина
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
    delete:
      tags: [Cart]
      summary: Удалить позицию
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Позиция удалена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/orders:
    get:
      tags: [Orders]
      summary: История заказов
      description: Заказы текущего пользователя, сортировка по дате создания.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Страница заказов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersPage"
              examples:
                page:
                  value:
                    items:
                      - id: 9f2c8d1e-4b3a-4c1e-9f2c-000000000001
                        number: ORD-2026-000123
                        status: NEW
                        itemsTotalCents: 102000
                        deliveryCents: 0
                        totalCents: 102000
                        createdAt: "2026-08-17T12:00:00Z"
                    page: 0
                    size: 20
                    total: 1
                    totalPages: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Orders]
      summary: Оформить заказ
      description: |
        Оформляет заказ из корзины одной транзакцией: списание остатков, создание
        снимков товаров, очистка корзины. Доставка в v1 бесплатная.
        Повторный запрос с тем же `X-Request-Id` не создаёт второй заказ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            examples:
              create:
                value:
                  customerName: Иванов Иван
                  customerPhone: "+375291234567"
                  deliveryCity: Добруш
                  deliveryAddress: "ул. Советская, 1"
                  comment: "Позвонить за час до доставки"
      responses:
        "201":
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              examples:
                created:
                  $ref: "#/components/examples/OrderResponseExample"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/BusinessRuleError"
  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Детали заказа
      description: Доступен только владельцу заказа.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Заказ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              examples:
                order:
                  $ref: "#/components/examples/OrderResponseExample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Отменить заказ
      description: Отмена возможна только в статусе NEW; остатки возвращаются.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Заказ отменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/favorites:
    get:
      tags: [Favorites]
      summary: Избранное
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Страница товаров в избранном
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoritesPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/favorites/{productId}:
    put:
      tags: [Favorites]
      summary: Добавить в избранное
      description: Идемпотентная операция.
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Товар в избранном
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Favorites]
      summary: Удалить из избранного
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Товар удалён из избранного
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/reviews/{id}:
    patch:
      tags: [Reviews]
      summary: Изменить свой отзыв
      description: Допускается только владельцем отзыва.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewRequest"
            examples:
              update:
                value: { rating: 4, text: "После использования — отличный сервиз." }
      responses:
        "200":
          description: Обновлённый отзыв
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Reviews]
      summary: Удалить свой отзыв
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Отзыв удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/categories:
    post:
      tags: [Admin]
      summary: Создать категорию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
            examples:
              create:
                value:
                  name: Чайные сервизы
                  slug: chainye-servizy
                  parentId: a1b2c3d4-1111-4c1e-9f2c-000000000001
                  description: Сервизы для чая
                  imageUrl: null
                  sortOrder: 1
      responses:
        "201":
          description: Категория создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryNode"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/admin/categories/{id}:
    patch:
      tags: [Admin]
      summary: Обновить категорию
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "200":
          description: Обновлённая категория
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryNode"
        "400":
