spring:
  application:
    name: practice-catalog-app

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:catalog}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false

  mvc:
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${APP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:practice-catalog-app}
    audience: ${JWT_AUDIENCE:practice-catalog-mobile}
    access-ttl-seconds: ${JWT_ACCESS_TTL:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL:2592000}
  kafka:
    retry:
      initial-ms: ${KAFKA_RETRY_INITIAL_MS:500}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${KAFKA_RETRY_MAX_INTERVAL_MS:10000}
      max-elapsed-ms: ${KAFKA_RETRY_MAX_ELAPSED_MS:20000}
  auth:
    refresh-cleanup-cron: ${REFRESH_CLEANUP_CRON:0 0 4 * * *}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:9000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:catalog-images}
